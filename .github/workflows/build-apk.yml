name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 📱 Build Optimized Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📝 Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      - name: ⚙️ Expo Prebuild Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: ⚡ Optimize Gradle for Lightweight Release APK & ABI Splitting
        run: |
          node -e "
            const fs = require('fs');
            const file = 'android/app/build.gradle';
            let content = fs.readFileSync(file, 'utf8');

            // 1. Enable ABI splitting (separate APK for arm64-v8a, cuts size by ~70%)
            content = content.replace(/def enableSeparateBuildPerCPUArchitecture = false/g, 'def enableSeparateBuildPerCPUArchitecture = true');

            // 2. Also generate universal APK
            content = content.replace(/universalApk false/g, 'universalApk true');

            // 3. Ensure release build type uses debug signing config so it can be installed on any phone
            content = content.replace(/signingConfig signingConfigs\.release/g, 'signingConfig signingConfigs.debug');

            fs.writeFileSync(file, content, 'utf8');
            console.log('✅ android/app/build.gradle configured for lightweight release builds!');
          "

      - name: 🛡️ Make gradlew Executable
        run: chmod +x android/gradlew

      - name: 🔨 Compile Optimized Android APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
        run: |
          cd android
          # Build Release APK with Hermes bytecode optimization
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: 📦 Collect Compiled APKs
        run: |
          mkdir -p dist-apk
          
          # Find specific architecture APKs and universal APK
          find android/app/build/outputs/apk -type f -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            echo "Menemukan APK: $filename"
            
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$apk" dist-apk/Buku-Kas-Ibuk-arm64-v8a-Lite.apk
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$apk" dist-apk/Buku-Kas-Ibuk-armeabi-v7a.apk
            elif [[ "$filename" == *"universal"* ]]; then
              cp "$apk" dist-apk/Buku-Kas-Ibuk-Universal.apk
            else
              cp "$apk" dist-apk/"$filename"
            fi
          done

          echo "=== DAFTAR FILE APK YANG BERHASIL DIKOMPILASI ==="
          ls -lh dist-apk/

      - name: 🚀 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Buku-Kas-Ibuk-Optimized-APKs
          path: dist-apk/*.apk
          retention-days: 30

      - name: 🏷️ Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "Buku Kas Ibuk ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }} (Release APK)"
          body: |
            ## 📱 Unduh Buku Kas Ibuk untuk Android

            Pilih salah satu file APK di bawah ini dan unduh langsung ke HP Android Anda:

            * 🚀 **[Buku-Kas-Ibuk-arm64-v8a-Lite.apk](https://github.com/alwinidzam/app-ibuk/releases/download/v1.0.0/Buku-Kas-Ibuk-arm64-v8a-Lite.apk)** (~16 MB)
              ⭐ **Sangat Direkomendasikan**: Khusus untuk Samsung Galaxy A54 dan semua smartphone Android modern (ukuran sangat ringan, hemat kuota, dan performa cepat).

            * 📦 **[Buku-Kas-Ibuk-Universal.apk](https://github.com/alwinidzam/app-ibuk/releases/download/v1.0.0/Buku-Kas-Ibuk-Universal.apk)** (~30 MB)
              Versi universal untuk semua jenis chipset Android lama maupun emulator.

            ---
            ### ✨ Fitur Unggulan:
            * **Tap-to-Inspect Detail Sheet**: Ketuk baris riwayat kas untuk melihat rincian penuh, foto nota, edit data, atau hapus dengan konfirmasi 2 langkah aman (Apple HIG).
            * **Multibuku Kas Fleksibel**: Tambah dan kelola pos buku kas tak terbatas (Kas Sekolah, Kas Ibu-Ibu PKK, Kas Rumah, dll).
            * **Simpan Foto Nota / Kwitansi**: Kompresi cerdas dan simpan bukti transaksi langsung di memori HP.
            * **Kirim Laporan ke WhatsApp**: Sekali klik untuk membagikan rekap kas atau bukti catatan ke grup bendahara WhatsApp.
            * **Offline-First & Mandiri**: Data tersimpan aman di HP tanpa ketergantungan server luar.
          files: dist-apk/*.apk
          draft: false
          prerelease: false
          make_latest: true

      - name: 📋 Build Summary Report
        run: |
          echo "### 📱 Build Android APK Ringan Berhasil! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "File APK berhasil dikompilasi dalam mode **Release (Hermes Optimized + ABI Split)** sehingga ukurannya jauh lebih kecil dan cepat:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Nama File | Ukuran | Keterangan |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in dist-apk/*.apk; do
            fname=$(basename "$f")
            fsize=$(du -h "$f" | cut -f1)
            echo "| **$fname** | \`$fsize\` | Siap diinstall di Android |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Rekomendasi**: Gunakan file **\`Buku-Kas-Ibuk-arm64-v8a-Lite.apk\`** untuk Samsung Galaxy A54 dan semua smartphone Android modern (ukuran sangat ramping & performa maksimal)." >> $GITHUB_STEP_SUMMARY
