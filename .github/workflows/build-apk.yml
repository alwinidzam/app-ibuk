name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 📱 Build Optimized Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📝 Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      - name: ⚙️ Expo Prebuild Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: ⚡ Configure Signing Config for Release
        run: |
          node -e "
            const fs = require('fs');
            const file = 'android/app/build.gradle';
            let content = fs.readFileSync(file, 'utf8');

            // Ensure release build type uses debug signing config so it can be installed on any phone without keystore errors
            content = content.replace(/signingConfig signingConfigs\.release/g, 'signingConfig signingConfigs.debug');

            fs.writeFileSync(file, content, 'utf8');
            console.log('✅ android/app/build.gradle configured for release signing!');
          "

      - name: 🛡️ Make gradlew Executable
        run: chmod +x android/gradlew

      - name: 🔨 Compile Optimized Android APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
        run: |
          mkdir -p dist-apk
          cd android

          # 1. Build Ultra-Lightweight arm64-v8a APK (~27 MB - Khusus Redmi Note 15 & Smartphone Modern)
          echo "🔨 Compiling arm64-v8a Lite APK..."
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          ARM64_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "Found arm64 APK: $ARM64_APK"
          cp "$ARM64_APK" ../dist-apk/Kas-Bu-Qom.apk
          cp "$ARM64_APK" ../dist-apk/Kas-Bu-Qom-arm64-v8a.apk
          rm -rf app/build/outputs/apk

          # 2. Build Universal APK (Support all chipsets)
          echo "🔨 Compiling Universal APK..."
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 --no-daemon
          UNIVERSAL_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "Found universal APK: $UNIVERSAL_APK"
          cp "$UNIVERSAL_APK" ../dist-apk/Kas-Bu-Qom-Universal.apk

          echo "=== DAFTAR FILE APK YANG BERHASIL DIKOMPILASI ==="
          ls -lh ../dist-apk/

      - name: 🚀 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kas-Bu-Qom-Optimized-APKs
          path: dist-apk/*.apk
          retention-days: 30

      - name: 🏷️ Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }}
          name: "Kas Bu Qom ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }} (Release APK)"
          body: |
            ## 📱 Unduh Kas Bu Qom untuk Android

            Pilih file APK di bagian **Assets** di bawah ini:

            * 🚀 **`Kas-Bu-Qom.apk`** (~27 MB)
              ⭐ **Sangat Direkomendasikan**: Khusus untuk Redmi Note 15, Samsung, dan semua smartphone Android modern (ukuran sangat hemat, unduh cepat, dan performa mulus).

            * 📦 **`Kas-Bu-Qom-Universal.apk`** (~73 MB)
              Versi universal untuk semua jenis chipset Android lama maupun emulator.

            ---
            ### ✨ Fitur Unggulan:
            * **Logo & Identitas Baru**: Menggunakan icon resmi **Kas Bu Qom**.
            * **Apple Ambient Mesh Lighting**: Gradien pendar halus di sudut layar sesuai identitas buku kas.
            * **Liquid Frosted Glass Dock**: Navigasi bawah dengan efek blur kaca cair asli dan rim specular.
            * **Tap-to-Inspect Detail Sheet**: Ketuk baris riwayat kas untuk melihat rincian penuh, foto nota, edit data, atau hapus dengan konfirmasi 2 langkah aman.
            * **Multibuku Kas Fleksibel**: Kelola pos kas tak terbatas (Kas Sekolah, Kas Ibu-Ibu, Kas Rumah, dll).
            * **Simpan Foto Nota / Kwitansi**: Kompresi cerdas dan simpan bukti transaksi langsung di memori HP.
            * **Kirim Laporan ke WhatsApp**: Sekali klik untuk membagikan rekap kas atau bukti catatan ke grup bendahara WhatsApp.
            * **Offline-First & Mandiri**: Data tersimpan aman di HP tanpa ketergantungan server luar.
          files: dist-apk/*.apk
          draft: false
          prerelease: false
          make_latest: true

      - name: 📋 Build Summary Report
        run: |
          echo "### 📱 Build Android APK Kas Bu Qom Berhasil! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "File APK berhasil dikompilasi dalam mode **Release (Hermes Optimized)**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Nama File | Ukuran | Keterangan |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in dist-apk/*.apk; do
            fname=$(basename "$f")
            fsize=$(du -h "$f" | cut -f1)
            echo "| **$fname** | \`$fsize\` | Siap diinstall di Android |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Rekomendasi**: Gunakan file **\`Kas-Bu-Qom.apk\`** untuk Redmi Note 15." >> $GITHUB_STEP_SUMMARY
