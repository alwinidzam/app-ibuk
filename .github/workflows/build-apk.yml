name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 📱 Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📝 Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      - name: ⚙️ Expo Prebuild Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🛡️ Make gradlew Executable
        run: chmod +x android/gradlew

      - name: 🔨 Compile Android APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Collect Compiled APK
        run: |
          mkdir -p dist-apk
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: File APK tidak ditemukan!"
            exit 1
          fi
          echo "✅ Menemukan file APK: $APK_FILE"
          cp "$APK_FILE" dist-apk/Buku-Kas-Ibuk.apk
          ls -lh dist-apk/

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buku-Kas-Ibuk-APK
          path: dist-apk/Buku-Kas-Ibuk.apk
          retention-days: 30

      - name: 📋 Build Summary Report
        run: |
          echo "### 📱 Build Android APK Berhasil! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "File APK berhasil dikompilasi secara otomatis di GitHub Actions." >> $GITHUB_STEP_SUMMARY
          echo "- **Nama Aplikasi**: Buku Kas Ibuk" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name**: \`com.bukukas.ibuk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`Buku-Kas-Ibuk.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cara Download**: Buka tab **Artifacts** di atas, lalu unduh \`Buku-Kas-Ibuk-APK\` dan pasang di HP Android." >> $GITHUB_STEP_SUMMARY
